[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "project-chameleon"
version = "0.1.0"
description = "Minimal deterministic capability-contract experiments for Project Chameleon"
requires-python = ">=3.9"
dependencies = ["scipy>=1.10"]

[tool.setuptools.packages.find]
where = ["src"]

